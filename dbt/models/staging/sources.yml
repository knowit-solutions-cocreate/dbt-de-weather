sources:
  - name: ingest
    description: Files written by the Dagster asset ingest/weather_daily_files (orchestrator/) into $WEATHER_DATA_DIR/raw (.env); without it ../data/raw, relative to dbt/ where dbt runs.
    tables:
      - name: weather_daily_files
        description: Daily Open-Meteo weather, one file per city per month in data/raw/<city>/<YYYY-MM>.parquet.
        config:
          meta:
            external_location: "{{ env_var('WEATHER_DATA_DIR', '../data') }}/raw/*/*.parquet"
