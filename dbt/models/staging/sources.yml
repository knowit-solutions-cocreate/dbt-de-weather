sources:
  - name: weather
    description: Parquet files written by ingest_weather.py (path relative to the repo root).
    tables:
      - name: weather_daily
        description: Daily Open-Meteo weather, one file per city per month in data/raw/<city>/<YYYY-MM>.parquet.
        config:
          meta:
            external_location: "data/raw/*/*.parquet"
