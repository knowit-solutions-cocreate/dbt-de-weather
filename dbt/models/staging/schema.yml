models:
  - name: stg_weather_daily
    description: Renamed and unit-converted daily weather (sunshine in hours).
    columns:
      - name: id
        description: Surrogate key of (city, date), carried over from raw_weather_daily.
        data_tests: [unique, not_null]
      - name: city_id
        description: References stg_cities.id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: id

  - name: stg_cities
    description: City attributes from the cities seed, the single entry point for city data in prod models.
    columns:
      - name: id
        description: Surrogate key of city.
        data_tests: [unique, not_null]
      - name: city
        data_tests: [unique, not_null]
