models:
  - name: raw_weather_daily
    description: Daily Open-Meteo weather per city, loaded incrementally from data/in parquet files.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city, date]
    columns:
      - name: id
        description: Surrogate key of (city, date).
        data_tests: [unique, not_null]
      - name: city
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]
