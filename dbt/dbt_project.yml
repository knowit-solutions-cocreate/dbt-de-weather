name: weather
version: "1.0"
profile: weather

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Paths (data/in, data/out) are relative to the repo root: run dbt from there with
# --project-dir dbt --profiles-dir dbt.

# +meta.dagster.group is the asset group in Dagster (orchestrator/), same as the ingestion asset.
models:
  weather:
    staging:
      +schema: staging
      +materialized: view
    prod:
      +schema: prod
      # Rebuilt in full every run and written to <external_root>/<model>.parquet (see profiles.yml).
      +materialized: external

seeds:
  weather:
    +schema: seeds
