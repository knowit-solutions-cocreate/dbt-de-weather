name: weather
version: "1.0"
profile: weather

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Paths (data/raw, data/stg, data/prod) are relative to the repo root: run dbt from there with
# --project-dir dbt --profiles-dir dbt.

models:
  weather:
    staging:
      +schema: staging
      +materialized: external
      +external_root: data/stg
    prod:
      +schema: prod
      # Rebuilt in full every run and written to <external_root>/<model>.parquet (see profiles.yml).
      +materialized: external

seeds:
  weather:
    +schema: seeds
