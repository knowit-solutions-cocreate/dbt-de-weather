name: weather
version: "1.0"
profile: weather

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Paths are relative to this folder: run dbt from here (the Makefile and Dagster both do).

# +meta.dagster.group is the asset group in Dagster (orchestrator/), same as the ingestion asset.
models:
  weather:
    +meta:
      dagster:
        group: weather
    staging:
      +schema: staging
      +materialized: view
    prod:
      +schema: prod
      # Rebuilt in full every run and written to <external_root>/<model>.parquet (see profiles.yml).
      +materialized: external

seeds:
  weather:
    +schema: seeds
    +meta:
      dagster:
        group: weather
