weather:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to dbt/, which is where dbt runs (see Makefile; Dagster runs it there too).
      path: "{{ env_var('WEATHER_DB_PATH', '../weather.duckdb') }}"
      schema: main
      external_root: "{{ env_var('WEATHER_DATA_DIR', '../data') }}/prod"
