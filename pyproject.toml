[project]
name = "dbt-de-weather"
version = "0.1.0"
description = "Swedish city weather: Open-Meteo ingestion, dbt + DuckDB transforms, marimo viz"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "altair>=6.3.0",
    "duckdb>=1.5.6",
    "marimo>=0.25.2",
    "pyarrow>=26.0.0"
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["B018"]  # marimo displays a cell's last bare expression

[tool.ruff.format]
quote-style = "double"
